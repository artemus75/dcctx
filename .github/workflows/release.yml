name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag: $RELEASE_TAG"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Verify tag matches main
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the authenticated GitHub API instead of a credential-less git fetch.
          # Confirm the tag commit is an ancestor of main (including equality).
          # This permits subsequent workflow-fix commits without moving the release tag.
          TAG_SHA=$(git rev-parse HEAD)
          MAIN_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${TAG_SHA}...${MAIN_SHA}" --jq '.status')
          case "$STATUS" in
            ahead|identical) echo "Tag $RELEASE_TAG is reachable from main" ;;
            *) echo "Tag $RELEASE_TAG is not an ancestor of main (status: $STATUS)"; exit 1 ;;
          esac
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go vet ./...
          go test ./...
          go build -o /tmp/dcctx-integration .
          BIN=/tmp/dcctx-integration bash test/integration.sh
      - name: Build release artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./build.sh "$RELEASE_TAG"
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Publish private prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/dcctx-* dist/SHA256SUMS \
            --title "$RELEASE_TAG" --generate-notes --prerelease
