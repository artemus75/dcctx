<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">dcctx: local and centrally managed Dev Container profiles</title><desc id="desc">Comparison of local project Dev Container configuration and explicit mapping to external profiles. Both launch through the Dev Container CLI. Workspace mounts are defined by the profile.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#2563eb"/></marker></defs>
<rect x="0" y="0" width="1200" height="780" rx="12" fill="#f8fafc" stroke="#f8fafc"/>
<text x="38" y="55" font-size="30" fill="#0f172a" font-weight="700">dcctx — Dev Container configuration models</text>
<text x="38" y="88" font-size="17" fill="#475569" font-weight="400">One CLI, two configuration sources; central profiles are registered explicitly.</text>
<rect x="30" y="115" width="550" height="300" rx="12" fill="#eff6ff" stroke="#cbd5e1"/>
<rect x="620" y="115" width="550" height="300" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="52" y="153" font-size="24" fill="#1e40af" font-weight="700">A. Local configuration</text>
<text x="642" y="153" font-size="24" fill="#047857" font-weight="700">B. External profile mapping</text>
<text x="52" y="194" font-size="18" fill="#0f172a" font-weight="600">~/projects/app-a/</text>
<text x="74" y="225" font-size="17" fill="#172554" font-weight="400">.devcontainer/devcontainer.json</text>
<text x="52" y="272" font-size="19" fill="#1d4ed8" font-weight="700">dcctx app-a</text>
<path d="M190 282 L190 321" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="65" y="327" width="480" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="82" y="351" font-size="16" fill="#172554" font-weight="400">Uses local config discovered under project root</text>
<text x="82" y="374" font-size="15" fill="#475569" font-weight="400">(also supports .devcontainer.json)</text>
<text x="642" y="195" font-size="17" fill="#0f172a" font-weight="600">~/git/engineering-devcontainers/</text>
<text x="662" y="226" font-size="16" fill="#172554" font-weight="400">.devcontainer/azure/devcontainer.json</text>
<text x="642" y="264" font-size="17" fill="#0f172a" font-weight="600">~/projects/azure-engineering/</text>
<text x="642" y="296" font-size="16" fill="#475569" font-weight="400">No local .devcontainer required</text>
<rect x="638" y="321" width="510" height="68" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="655" y="347" font-size="16" fill="#047857" font-weight="700">dcctx --map-profile PROJECT CONFIG WORKDIR</text>
<text x="655" y="372" font-size="15" fill="#475569" font-weight="400">Stored locally in ~/.config/dcctx/profiles</text>
<rect x="30" y="445" width="1140" height="296" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="52" y="486" font-size="24" fill="#0f172a" font-weight="700">Execution flow (both models)</text>
<rect x="52" y="515" width="238" height="154" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="65" y="548" font-size="18" fill="#0f172a" font-weight="700">1. Select project</text>
<text x="65" y="590" font-size="15" fill="#172554" font-weight="400">dcctx app-a</text>
<text x="65" y="617" font-size="15" fill="#172554" font-weight="400">dcctx azure-engineering</text>
<rect x="337" y="515" width="238" height="154" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="350" y="548" font-size="18" fill="#0f172a" font-weight="700">2. Resolve config</text>
<text x="350" y="590" font-size="15" fill="#172554" font-weight="400">Local config OR registered</text>
<text x="350" y="617" font-size="15" fill="#172554" font-weight="400">external --config mapping</text>
<rect x="622" y="515" width="238" height="154" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="635" y="548" font-size="18" fill="#0f172a" font-weight="700">3. Start + enter</text>
<text x="635" y="590" font-size="15" fill="#172554" font-weight="400">devcontainer up</text>
<text x="635" y="617" font-size="15" fill="#172554" font-weight="400">devcontainer exec</text>
<rect x="907" y="515" width="238" height="154" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="920" y="548" font-size="18" fill="#0f172a" font-weight="700">4. Workspace</text>
<text x="920" y="590" font-size="15" fill="#172554" font-weight="400">Project folder selected;</text>
<text x="920" y="617" font-size="15" fill="#172554" font-weight="400">mounts defined by profile</text>
<path d="M290 589 L330 589" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<path d="M575 589 L615 589" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<path d="M860 589 L900 589" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<text x="52" y="712" font-size="14" fill="#475569" font-weight="400">Example: devcontainer up --workspace-folder ~/projects/azure-engineering --config ~/git/engineering-devcontainers/.devcontainer/azure/devcontainer.json</text>
</svg>